name: Contracts and web
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Solidity build
        run: forge build
      - name: Unit, adversarial and fuzz tests
        run: forge test --fuzz-runs 1024 -vvv
      - name: Real local Anvil deployment and eleven-argument release gate
        run: node script/anvil-e2e.mjs
      - name: End-to-end mock bounty on fresh Anvil, with payout, slashing, refunds and exact accounting
        run: node script/run-bounty-lifecycle.mjs --local
      - name: Independent policy reference tests
        run: node --test checks/reference.test.mjs checks/deployment-proof.test.mjs checks/deployment-cli.test.mjs checks/broadcast-args.test.mjs
      - name: Web policy and validation tests
        run: node --test web/test/core.test.mjs web/test/onchain.test.mjs web/test/pay-core.test.mjs web/test/support-core.test.mjs web/test/public-history.test.mjs web/test/bounty-core.test.mjs web/test/wif-core.test.mjs
      - name: Browser source syntax
        run: node --check web/app.js && node --check web/onchain.mjs && node --check web/pay.js && node --check web/pay-core.mjs && node --check web/support.js && node --check web/support-tour.mjs && node --check web/support-core.mjs && node --check web/public-history.mjs && node --check web/public-history-ui.mjs && node --check web/landing.js && node --check web/bounty.js && node --check web/wif.js && node --check web/wif-core.mjs && node --check web/bounty-core.mjs && node --check script/run-bounty-lifecycle.mjs && node --check script/run-public-bounty-acceptance.mjs && node --check qa/issue-8-public-testnet-audit.mjs && node --check qa/issue-8-fresh-bounty-audit.mjs && node --check qa/support-e2e.mjs && node --check script/verify-testnet.mjs

  browser-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked browser test dependencies
        run: npm ci --prefix qa
      - name: Install Chromium and system libraries
        working-directory: qa
        run: npx playwright install --with-deps chromium
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Accessibility, responsive and mocked-wallet regression
        run: node qa/verify.mjs
      - name: BEFORE Pay mocked-wallet security and proof regression
        run: node qa/pay-e2e.mjs
      - name: BEFORE Support repeat-use and duplicate-send regression
        run: node qa/support-e2e.mjs
      - name: Self-service bounty user journey on local Anvil with real wallet transactions
        run: node qa/bounty-e2e.mjs
      - name: Read-only WIF permission inspector accessibility and fail-closed checks
        run: node qa/wif-verify.mjs
