name: Diagnose BEFORE public WIF history
on:
  push:
    branches: [demo/final-support-storyboard-2026-11-10]
    paths: [".github/workflows/diagnose-before-history.yml", "demo/diagnose-history.mjs"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Set up Chromium
        run: |
          cd demo
          npm install --no-save --silent playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Diagnose actual production UI and RPC
        run: node demo/diagnose-history.mjs
      - name: Preserve exact UI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BEFORE-HISTORY-DIAGNOSTIC
          path: demo/diag-output/
          if-no-files-found: warn
          retention-days: 7
