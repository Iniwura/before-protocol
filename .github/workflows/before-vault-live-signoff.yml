name: BEFORE vault live sign-off (read only)
on:
  push:
    branches: [qa/verify-vault-live-before-signoff-2026-11-10]
    paths:
      - "qa/vault-live-signoff.mjs"
      - "qa/vault-ui-e2e.mjs"
      - ".github/workflows/before-vault-live-signoff.yml"
permissions:
  contents: read
jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build source to verify deployed code identity
        run: forge build
      - name: Confirm live production button, historical onchain vault, owner, limits and simulated creation
        run: node qa/vault-live-signoff.mjs
      - name: Install browser test dependencies
        run: |
          npm ci --prefix qa
          cd qa && npx playwright install --with-deps chromium
      - name: Real browser create vault and withdraw using disposable local 46630 Anvil
        run: node qa/vault-ui-e2e.mjs
      - name: Historical eleven-argument verifier (archival-state caveat)
        shell: bash
        run: |
          mkdir -p qa/results
          set +e
          node - <<'NODE' > qa/results/VERIFIER_HISTORICAL.log 2>&1
          const {spawnSync}=require('node:child_process');
          const c=require('./web/deployment.json');
          const args=[
            'script/verify-testnet.mjs',
            c.factory,c.factoryTx,c.mockToken,c.mockTokenTx,
            c.challengeEscrow,c.challengeEscrowTx,c.demoTx,c.practiceTx,
            c.allowedTx,c.deniedTx,c.practiceProofTx
          ];
          const result=spawnSync('node',args,{stdio:'inherit',timeout:420000});
          process.exit(result.status===null?1:result.status);
          NODE
          rc=$?
          set -e
          cat qa/results/VERIFIER_HISTORICAL.log
          if [[ "$rc" != "0" ]]; then
            if grep -Eqi 'historical state .* is not available' qa/results/VERIFIER_HISTORICAL.log; then
              echo 'ARCHIVAL LIMITATION: public endpoint no longer supports archived historical balances. Not a transaction revert.'
            else
              echo 'UNEXPECTED VERIFIER FAILURE'; exit "$rc"
            fi
          fi
      - name: Upload detailed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BEFORE-LIVE-VAULT-SIGNOFF-EVIDENCE
          path: |
            qa/results/VAULT_SIGNOFF_LIVE.json
            qa/results/VERIFIER_HISTORICAL.log
            qa/results/vault-ui/
          retention-days: 14
          if-no-files-found: warn
